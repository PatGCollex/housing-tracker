name: HousingTracker
options:
  bundleIdPrefix: org.garealtors
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""          # filled in by the TestFlight workflow
    CODE_SIGN_STYLE: Automatic
targets:
  HousingTracker:
    type: application
    platform: iOS
    sources: [HousingTracker]
    info:
      path: HousingTracker/Info.plist
      properties:
        CFBundleDisplayName: Housing Bills
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [org.garealtors.housingtracker.refresh]
        DataURL: "https://USERNAME.github.io/housing-tracker/data"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.garealtors.housingtracker
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
